<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>研究室配属</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>研究室配属</h1>
      <p>
        学生の希望順位と研究室ごとの点数から、安定マッチング
        （学生側最適の受入保留アルゴリズム）で配属を決めます。
      </p>
    </header>

    <main id="app">
      <!--
        Shown until main.ts runs, i.e. when index.html is opened as a file or
        served by a plain static server rather than through Vite.
      -->
      <p class="boot">
        <b>スクリプトが読み込まれていません。</b>
        このページは <code>/src/main.ts</code> を TypeScript のまま読み込むので、
        Vite の開発サーバー経由でしか動きません。<code>npm run dev</code> で表示された
        URL を開いてください。静的に配信したい場合は <code>npm run build</code> で
        <code>dist/</code> にバンドルしてから、それを配信してください。
      </p>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
